name: skill-review
label: Skill Review
kind: standalone
version: 0.3.0-dev
description: >
  Desktop review tab for staged skill and memory writes (skills.write_approval
  and memory.write_approval) of the profile Desktop is connected to. Shows each
  pending change as a diff block per file and accepts or rejects whole writes
  through Hermes's public write review API (tools.write_review_api); it never
  reads or rewrites the pending queue itself. On a Hermes without that API the
  tab shows one message. Library mode lists the profile's SOUL.md, PROJECT.md,
  AGENTS.md, MEMORY.md, USER.md and skill files; it saves only the identity
  files (SOUL.md, PROJECT.md, AGENTS.md) and opens memory and skill files
  read-only. Library needs Linux or macOS. No network calls, no telemetry, no
  credentials, no tools or hooks.
author: hosakb
license: MIT
homepage: https://github.com/hosakb/hermes-skill-review
tags: [desktop, skills, memory, review, diff]
requires_hermes: ">=0.23.2"
provides_tools: []
provides_hooks: []
